name: Release

on:
  push:
    branches: [main]

# Gate: releases are only ever built and published from this exact repository,
# never from forks or clones. Version commits carry the owner's GitHub identity
# so the bot never shows up as a contributor.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'we4OnTop/mindtero'
    runs-on: windows-latest
    env:
      OWNER_LOGIN: we4OnTop
      OWNER_ID: '127755854'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
          NEXT=$(PREV="$PREV" node -e '
            const v = process.env.PREV.replace(/^v/, "");
            const [major, minor, patch] = v.split(".");
            process.stdout.write(`v${major}.${minor}.${Number(patch) + 1}`);
          ')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          $env:VERSION = "${VERSION#v}"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          node node_modules/typescript/bin/tsc -b
          npx vitest run

      - name: Build web bundle
        run: npm run build

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "${OWNER_LOGIN}"
          git config user.email "${OWNER_ID}+${OWNER_LOGIN}@users.noreply.github.com"
          git add package.json
          if (!(git diff --cached --quiet)) {
            git commit -m "chore(release): bump to $($VERSION -replace '^v', '')"
          }
          git push
        shell: pwsh

      - name: Package exe installer
        run: npx electron-builder --win portable --publish never

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: "Mindtero ${{ steps.version.outputs.next }}"
          generate_release_notes: true
          files: |
            dist/installer/*.exe

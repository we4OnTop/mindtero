name: Release

on:
  push:
    branches: [main]

# Gate: releases are only ever built and published from this exact repository,
# never from forks or clones.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'we4OnTop/mindtero'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v0.0.0")
          NEXT=$(PREV="$PREV" node -e '
            const v = process.env.PREV.replace(/^v/, "");
            const [major, minor, patch] = v.split(".");
            process.stdout.write(`v${major}.${minor}.${Number(patch) + 1}`);
          ')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          VERSION="${VERSION#v}"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        run: |
          npm run lint
          node node_modules/typescript/bin/tsc -b
          npx vitest run

      - name: Build web bundle
        run: npm run build

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "mindtero-release-bot"
          git config user.email "actions@github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump to ${NEXT#v}"
          fi
          git push

      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          git tag -f "${VERSION}"
          git push origin "${VERSION}"

      - name: Package bundle
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          (cd dist && zip -r "../mindtero-${VERSION}-web.zip" .)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: "Mindtero ${{ steps.version.outputs.next }}"
          generate_release_notes: true
          files: mindtero-*-web.zip

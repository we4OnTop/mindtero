name: Release

on:
  push:
    branches: [main]

# Gate: releases are only ever built and published from this exact repository,
# never from forks or clones. Version commits carry the owner's GitHub identity
# so the bot never shows up as a contributor.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'we4OnTop/mindtero'
    runs-on: windows-latest
    env:
      OWNER_LOGIN: we4OnTop
      OWNER_ID: '127755854'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Highest existing tag by version, not the nearest ancestor: release tags
          # can sit on commits that are no longer in main's history, and
          # `git describe` then falls back to an older tag and re-releases it.
          PREV=$(git tag --list "v*" --sort=-v:refname | head -n 1)
          PREV=${PREV:-v0.0.0}
          NEXT=$(PREV="$PREV" node -e '
            const v = process.env.PREV.replace(/^v/, "");
            const [major, minor, patch] = v.split(".");
            process.stdout.write(`v${major}.${minor}.${Number(patch) + 1}`);
          ')
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::Tag $NEXT already exists — refusing to overwrite an existing release"
            exit 1
          fi
          echo "Releasing $NEXT (previous: $PREV)"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          VERSION="${VERSION#v}"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "Bumped to ${VERSION}"
        shell: bash

      - name: Install
        run: npm ci

      - name: Lint, typecheck and test
        # bash with -e: in pwsh a failing native command does not stop the step,
        # so a lint failure would have been ignored.
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          node node_modules/typescript/bin/tsc -b
          npx vitest run

      - name: Build web bundle
        run: npm run build

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.next }}
        # bash, not pwsh: the ${OWNER_LOGIN} syntax is empty in PowerShell, which left
        # git without an identity and silently skipped the commit.
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "$OWNER_LOGIN"
          git config user.email "$OWNER_ID+$OWNER_LOGIN@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump to ${VERSION#v}"
          fi
          git push

      - name: Package exe installer
        run: npx electron-builder --win portable --publish never

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: "Mindtero ${{ steps.version.outputs.next }}"
          generate_release_notes: true
          files: |
            dist/Mindtero*.exe
